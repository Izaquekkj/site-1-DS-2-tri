<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog</title>

    <style>
        body {
            background-color: #f4f6f9;
            color: #333;
        }

        header {
            background-color: #071955;
            color: #f8f6f9;
            text-align: center;
            padding: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        header p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        button:hover {
            background-color: #2563eb;
        }

        main {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 50px; 
        }

        h2 {
            color: #071955;
            margin-bottom: 10px;
        }

        .autor {
            font-size: 0.9rem;
            color: #666;
            font-style: italic;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 30px auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

    <header>
        <h1>Jogos Recém-lançados pela Steam</h1>
    </header>

    <main>
        <h2>Os jogos lançados</h2>
        <p class="autor">Por: Emanuel Izaque</p>
    </main>

</body>
</html>
